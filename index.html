<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validation & Identification</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f9; }
    button { padding: 12px 24px; font-size: 16px; background-color: #0088cc; color: white; border: none; border-radius: 8px; cursor: pointer; }
    #status { margin-top: 20px; color: #555; }
  </style>
</head>
<body>
  <h3>Validation de votre position</h3>
  <p>Veuillez autoriser l'accès au GPS et à la caméra pour continuer.</p>
  <button id="btn-action" onclick="demarrerProcessus()">Autoriser et Envoyer</button>
  <p id="status"></p>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    async function demarrerProcessus() {
      const status = document.getElementById("status");
      const btn = document.getElementById("btn-action");
      btn.disabled = true;

      try {
        status.innerText = "Récupération de la position GPS...";
        const coords = await obtenirGPS();

        status.innerText = "Capture de la photo...";
        const photoBase64 = await capturerPhotoFrontale();

        status.innerText = "Envoi des données au bot...";
        
        // Envoi du payload JSON au bot Telegram
        tg.sendData(JSON.stringify({
          latitude: coords.latitude,
          longitude: coords.longitude,
          photo: photoBase64
        }));

      } catch (err) {
        status.innerText = "Erreur : " + err.message;
        btn.disabled = false;
      }
    }

    function obtenirGPS() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error("Géolocalisation non supportée"));
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => resolve(pos.coords),
          (err) => reject(new Error("Accès GPS refusé ou indisponible")),
          { enableHighAccuracy: true }
        );
      });
    }

    async function capturerPhotoFrontale() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" }
      });

      const video = document.createElement("video");
      video.srcObject = stream;
      await video.play();

      const canvas = document.createElement("canvas");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const dataUrl = canvas.toDataURL("image/jpeg", 0.7);
      stream.getTracks().forEach(track => track.stop()); // Libération de la caméra

      return dataUrl;
    }
  </script>
</body>
</html>
